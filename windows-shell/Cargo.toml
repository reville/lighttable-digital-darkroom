[package]
name = "lighttable-desktop-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
base64 = "0.22.1"
directories = "6"
getrandom = "0.2.17"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
