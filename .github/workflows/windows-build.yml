name: Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (leave blank for a CI build)
        required: false
        type: string
      require_signing:
        description: Require valid Authenticode signatures for release artifacts
        required: false
        default: false
        type: boolean
      build_run_id:
        description: Recheck native acceptance of an earlier package without rebuilding (leave blank for a normal build)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        description: Exact source commit selected by the release workflow
        required: false
        type: string
      require_signing:
        description: Require valid Authenticode signatures for release artifacts
        required: false
        default: false
        type: boolean
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      SPARKLE_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  # A routine main build must not cancel a production-signed candidate.
  group: windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.build_run_id || 'build' }}-${{ inputs.require_signing && 'signed' || 'unsigned' }}
  cancel-in-progress: true

jobs:
  native-recheck:
    if: github.event_name == 'workflow_dispatch' && inputs.build_run_id != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows-native.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}

  installer-check:
    if: github.event_name != 'workflow_dispatch' || !inputs.build_run_id
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Require install, repair and data-preserving uninstall
        shell: pwsh
        run: ./scripts/windows/installer-fixture-smoke.ps1

  quick-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      UV_CACHE_DIR: ${{ github.workspace }}\.build\uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.88.0

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
            windows-shell/target
            .build/uv-cache
          key: windows-cargo-check-v2-${{ hashFiles('rust-engine/Cargo.lock', 'windows-shell/Cargo.lock', 'packaging/runtime-windows.lock') }}
          restore-keys: |
            windows-cargo-check-v2-
            windows-cargo-check-v1-
            windows-cargo-

      - name: Validate packaging script syntax
        shell: pwsh
        run: |
          foreach ($Script in Get-ChildItem ./scripts/windows -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          python -m unittest discover -s tests -p test_process_liveness.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_launcher_control.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_durable_io.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_desktop_smoke.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_packaging.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_updater.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_webview2_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the staged Windows runtime
        shell: pwsh
        run: |
          python -m pip install uv==0.11.28
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows/build-release.ps1 -RuntimeSmokeOnly

      - name: Check Windows Rust targets
        shell: pwsh
        run: |
          $Target = "x86_64-pc-windows-msvc"
          cargo check --locked --target $Target --manifest-path rust-engine/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --locked --target $Target --manifest-path windows-shell/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || !inputs.build_run_id)
    needs: installer-check
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    # windows-release permits only main and v* tags; windows-ci has no Azure trust.
    environment: ${{ inputs.require_signing && 'windows-release' || 'windows-ci' }}
    env:
      UV_CACHE_DIR: ${{ github.workspace }}\.build\uv-cache
      AZURE_SIGNING_ENDPOINT: ${{ inputs.require_signing && vars.AZURE_SIGNING_ENDPOINT || '' }}
      AZURE_SIGNING_ACCOUNT: ${{ inputs.require_signing && vars.AZURE_SIGNING_ACCOUNT || '' }}
      AZURE_SIGNING_PROFILE: ${{ inputs.require_signing && vars.AZURE_SIGNING_PROFILE || '' }}
      AZURE_TENANT_ID: ${{ inputs.require_signing && vars.AZURE_TENANT_ID || '' }}
      AZURE_CLIENT_ID: ${{ inputs.require_signing && vars.AZURE_CLIENT_ID || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install pinned Azure signing dependencies
        if: inputs.require_signing && vars.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: ./scripts/windows/install-signing-tools.ps1

      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ inputs.require_signing && 'true' || 'false' }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ./scripts/windows/sign-release.ps1 -CheckOnly -RequireSigning:($env:REQUIRE_SIGNING -eq 'true') | Out-Null
          if ($env:REQUIRE_SIGNING -eq 'true' -and [string]::IsNullOrWhiteSpace($env:SPARKLE_PRIVATE_KEY)) {
            throw "Windows release updates require SPARKLE_PRIVATE_KEY."
          }

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-engine/target
            windows-shell/target
            .build/uv-cache
          key: windows-cargo-package-v1-${{ hashFiles('rust-engine/Cargo.lock', 'windows-shell/Cargo.lock', 'packaging/runtime-windows.lock', 'scripts/windows/build-release.ps1') }}
          restore-keys: |
            windows-cargo-package-v1-
            windows-cargo-

      - name: Install pinned build tools
        shell: pwsh
        run: |
          # The pinned export engine's locked RAW dependencies require 1.88.
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
          rustup default 1.88.0
          python -m pip install uv==0.11.28
          choco install nsis --no-progress -y

      - name: Build and smoke-test package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}
          REQUIRE_SIGNING: ${{ inputs.require_signing && 'true' || 'false' }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python -m unittest discover -s tests -p test_process_liveness.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_durable_io.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_desktop_smoke.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_packaging.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_windows_updater.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_webview2_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows/build-release.ps1 -Version $env:PACKAGE_VERSION -RequireSigning:($env:REQUIRE_SIGNING -eq 'true')

      - name: Verify signatures in the completed artifacts
        if: inputs.require_signing
        shell: pwsh
        run: |
          $Archive = Get-ChildItem ./dist/LightTable-*-windows-x64.zip | Select-Object -First 1
          $Installer = Get-ChildItem ./dist/LightTable-*-windows-x64-setup.exe | Select-Object -First 1
          ./scripts/windows/verify-release-signatures.ps1 -Archive $Archive.FullName -Installer $Installer.FullName -Report ./dist/windows-signatures.json

      - name: Upload portable build and installer
        # Preserve a completed package for diagnosis/rechecks even if native
        # acceptance fails. The package job still fails and blocks release.yml.
        uses: actions/upload-artifact@v4
        with:
          name: LightTable-windows-x64
          path: |
            dist/LightTable-*-windows-x64.zip
            dist/LightTable-*-windows-x64-setup.exe
            dist/appcast-windows-x64.xml
            dist/windows-signatures.json
          if-no-files-found: error

      - name: Require native edit, export and restart
        timeout-minutes: 10
        shell: pwsh
        run: |
          $Archive = Get-ChildItem ./dist/LightTable-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $Archive.FullName -DestinationPath ./.build/native-candidate
          $Bundle = (Resolve-Path ./.build/native-candidate/LightTable).Path
          & "$Bundle/Python/python.exe" -B ./scripts/windows/desktop-smoke.py $Bundle --timeout 240 --report-dir ./.build/windows-desktop-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-native-acceptance
          path: .build/windows-desktop-evidence/
          if-no-files-found: ignore
