name: Snap folder portal acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/linux-package-channels-20260909]
    paths:
      - .github/workflows/snap-portal-candidate.yml
      - scripts/linux/snap-portal-acceptance.*
permissions:
  contents: read
  actions: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LightTable-snap-release-candidate
          path: .build/tested-snap
          run-id: 34421280370
          github-token: ${{ github.token }}
      - name: Install the exact tested strict candidate and private desktop
        run: |
          echo '026b76674605cac4714c66ad9f9d79491d128742184a96e39f101a41bbaf80e9  .build/tested-snap/dist/LightTable-0.5.0-linux-x86_64.snap' | sha256sum -c -
          sudo snap install --dangerous .build/tested-snap/dist/LightTable-0.5.0-linux-x86_64.snap
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox imagemagick xdotool dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk
          sudo mkdir -p /media/lighttable-portal/photos
          sudo chown -R "$USER:$USER" /media/lighttable-portal
          convert -size 128x128 xc:'#3296d2' /media/lighttable-portal/photos/smoke.png
          mkdir -p evidence
          snap connections lighttable > evidence/connections-before.txt
      - name: Native folder grant and catalog reopen without removable-media connection
        run: |
          timeout 250s xvfb-run -a --server-args="-screen 0 1440x1000x24" bash scripts/linux/snap-portal-acceptance.sh
      - name: Explicit removable-media connection permits direct access
        run: |
          sudo snap connect lighttable:removable-media
          timeout 30s snap run --shell lighttable.cli -c 'test -r /media/lighttable-portal/photos/smoke.png'
          snap connections lighttable > evidence/connections-connected.txt
          sudo snap disconnect lighttable:removable-media
      - name: Retain actual native evidence and remove ephemeral installation
        if: always()
        run: |
          mkdir -p evidence
          cp -R "$HOME/snap/lighttable/common/portal-evidence" evidence/desktop 2>/dev/null || true
          if [[ -f evidence/desktop/desktop.log ]]; then tail -80 evidence/desktop/desktop.log; fi
          journalctl --user --no-pager -u xdg-desktop-portal -u xdg-desktop-portal-gtk | tail -120 > evidence/portals.log
          sudo journalctl -k --no-pager | tail -160 > evidence/kernel-tail.txt
          if snap list lighttable >/dev/null 2>&1; then sudo snap remove --purge lighttable; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightTable-snap-portal-evidence
          path: evidence
