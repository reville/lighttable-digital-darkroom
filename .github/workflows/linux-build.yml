name: Linux build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_screenshots:
        description: Capture native screenshots from the published Linux release
        type: boolean
        default: false
      version:
        description: Package version (leave blank for a CI build)
        required: false
        type: string
  workflow_call:
    inputs:
      build_package:
        description: Build and smoke-test the complete package for packaging pull requests
        required: false
        default: false
        type: boolean
      version:
        required: true
        type: string
      source_ref:
        description: Exact source commit selected by the release workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-linux:
    name: Capture native Linux screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.capture_screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native desktop capture dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libxdo3 libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libgomp1 libopenblas0-pthread xvfb xauth dbus-x11 openbox xdotool x11-utils imagemagick tesseract-ocr python3-pil fonts-dejavu-core
      - name: Fetch the exact checksummed Pexels inputs
        run: |
          python3 - <<'PYCODE'
          import csv, hashlib, pathlib, re, subprocess
          root = pathlib.Path('scripts/screenshots/photos/pexels')
          root.mkdir()
          with open('scripts/screenshots/photos/manifest.tsv') as stream:
              for item in csv.DictReader(stream, delimiter='\t'):
                  url = item['download_url']
                  data = subprocess.check_output(['curl', '--fail', '--location', '--retry', '3', '--max-time', '60', '--silent', '--show-error', url], timeout=240)
                  assert hashlib.sha256(data).hexdigest() == item['sha256'], item['filename']
                  (root / item['filename']).write_bytes(data)
          PYCODE
      - name: Download and verify the published Linux application
        run: |
          curl --fail --location --retry 3 -o /tmp/lighttable.tar.gz https://github.com/reville/lighttable-digital-darkroom/releases/download/v0.5.0/LightTable-0.5.0-linux-x86_64.tar.gz
          echo 'eaf1fb58d038d7260473343ab3bb64a3101ab5d180c09020af80b08929343f01  /tmp/lighttable.tar.gz' | sha256sum --check
          mkdir /tmp/lighttable-capture-bundle
          tar -xzf /tmp/lighttable.tar.gz -C /tmp/lighttable-capture-bundle
      - name: Check the packaged render worker
        run: |
          ldd /tmp/lighttable-capture-bundle/LightTable/Resources/LightTable/engine/lighttable-engine
          printf '%s\n' '{"command":"probe_input","input_cache_key":"capture-preflight","id":1}' | SPEKTRAFILM_BACKEND=cpu /tmp/lighttable-capture-bundle/LightTable/Resources/LightTable/engine/lighttable-engine
      - name: Capture the actual GTK desktop in an isolated 2x display
        run: |
          timeout --signal=TERM --kill-after=20s 35m xvfb-run --auto-servernum --server-args='-screen 0 4000x2400x24 -dpi 96 -nolisten tcp' dbus-run-session -- bash -c '
            openbox >/tmp/capture-openbox.log 2>&1 &
            manager_pid=$!
            trap "kill $manager_pid 2>/dev/null || true" EXIT
            export GDK_SCALE=2 GDK_DPI_SCALE=1 GTK_CSD=1 GTK_THEME=Adwaita:dark
            python3 scripts/screenshots/linux_capture.py --bundle /tmp/lighttable-capture-bundle/LightTable --output-dir /tmp/pexels-linux-captures --only export-workflow
          '
      - name: Retain native masters and provenance for local review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-linux-screenshots
          path: /tmp/pexels-linux-captures/
          retention-days: 14
          if-no-files-found: warn

  package:
    if: ${{ !inputs.capture_screenshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/linux/cargo
      UV_CACHE_DIR: ${{ github.workspace }}/.build/linux/uv-cache
      SPEKTRAFILM_BACKEND: cpu
      LIGHTTABLE_LINUX_UPDATE_PUBLIC_KEY: ${{ vars.LIGHTTABLE_LINUX_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install Node.js for shared interface tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux build dependencies
        run: |
          # The hosted image may retain Chrome's updater source. This WebKit
          # build does not use it, and stale Chrome metadata can break apt update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          # Azure's archive mirror can stall even tiny downloads for minutes.
          # Keep Ubuntu's signed repositories, using its standard archive and
          # bounded transport retries on the ephemeral hosted runner.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/80lighttable-downloads >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake gfortran libssl-dev libopenblas-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev libvulkan1 mesa-vulkan-drivers \
            libgl1 libegl1 libgomp1 liblcms2-2 desktop-file-utils xdg-utils libglib2.0-bin gvfs zenity \
            xdg-desktop-portal xdg-desktop-portal-gtk python3-venv xvfb xauth dbus-x11 weston
          rustup toolchain install 1.88.0 --profile minimal --target x86_64-unknown-linux-gnu
          python3 -m venv .build/linux/build-tools
          .build/linux/build-tools/bin/pip install uv==0.11.28
          echo "$PWD/.build/linux/build-tools/bin" >> "$GITHUB_PATH"

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/linux/cargo
            .build/linux/uv-cache
          key: linux-package-v1-${{ hashFiles('rust-engine/Cargo.lock', 'windows-shell/Cargo.lock', 'requirements-runtime.lock', 'packaging/runtime-linux.lock', 'packaging/linux/runtime.json') }}
          restore-keys: linux-package-v1-

      - name: Validate packaging and Linux targets
        run: |
          python3 -m unittest discover -s tests -p test_linux_packaging.py -v
          python3 -m unittest discover -s tests -p test_linux_arch_packaging.py -v
          python3 -m unittest discover -s tests -p test_linux_aur_packaging.py -v
          python3 -m unittest discover -s tests -p test_linux_updater_smoke.py -v
          cargo +1.88.0 test --locked --manifest-path rust-engine/Cargo.toml
          cargo +1.88.0 test --locked --manifest-path windows-shell/Cargo.toml
          SPEKTRAFILM_BACKEND=wgpu cargo +1.88.0 test \
            --manifest-path rust-engine/vendor/spektrafilm/Cargo.toml \
            -p spektrafilm-gpu portability_tests -- --include-ignored

      - name: Prepare pinned Linux test runtime
        run: |
          python3 scripts/linux/prepare-test-runtime.py
          # The source CLI resolves its colocated .venv, as development users do.
          ln -s .build/linux/test-runtime .venv
          LIGHTTABLE_TEST_DATA_DIR="$PWD/engine/data" cargo +1.88.0 test --locked \
            --manifest-path rust-engine/Cargo.toml \
            resident_cache_tests::oversized_request_uses_cpu_then_returns_to_original_backend -- --ignored

      - name: Test Linux storage, shared memory, decoding and portable color
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/spektrafilm/src
        run: |
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_desktop_updater.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_desktop_update_coordination.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_desktop_acceptance.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_platform_paths.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_theme.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_shared_input.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_raw_decode_cache.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_platform_image.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_tiff_precision.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_windows_precision_cache.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_one_shot.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_linux_engine_recovery.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_cli_control.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_cli_installation.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_first_run.py -v

      - name: Test shared interface and first-run behavior
        # These tests use Node's built-in runner and local modules; no npm dependencies.
        run: node --test tests/*.test.mjs

      - name: Test float32 grade and merge parity on software Vulkan
        timeout-minutes: 10
        env:
          LIGHTTABLE_TEST_GPU: '1'
          LIGHTTABLE_GPU_COMPUTE: '1'
          SPEKTRAFILM_BACKEND: wgpu
          PYTHONPATH: ${{ github.workspace }}/vendor/spektrafilm/src
        run: |
          # A resident debug worker exercises real GPU requests on PRs without
          # building a distributable package. Mesa validates correctness here;
          # software Vulkan results do not establish hardware performance.
          cargo +1.88.0 build --locked --manifest-path rust-engine/Cargo.toml --bin lighttable-engine
          ln -s "$CARGO_TARGET_DIR/debug/lighttable-engine" engine/lighttable-engine
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_gpu_grade.py -v
          .build/linux/test-runtime/bin/python3 -m unittest discover -s tests -p test_merge_acceleration.py -v

      - name: Build and smoke-test relocated package
        if: github.event_name != 'pull_request' || inputs.build_package
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}
        run: ./scripts/linux/build-release.sh --version "$PACKAGE_VERSION"

      - name: Retain completed portable bundle before native acceptance
        if: github.event_name != 'pull_request' || inputs.build_package
        uses: actions/upload-artifact@v4
        with:
          name: LightTable-linux-x86_64
          path: |
            dist/LightTable-*-linux-x86_64.tar.gz
            dist/LightTable-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

      - name: Open native GTK desktop and require a rendered photo
        if: github.event_name != 'pull_request' || inputs.build_package
        timeout-minutes: 3
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}
        run: |
          mkdir -p ".build/linux/native desktop smoke"
          tar -xzf "dist/LightTable-$PACKAGE_VERSION-linux-x86_64.tar.gz" -C ".build/linux/native desktop smoke"
          BUNDLE="$PWD/.build/linux/native desktop smoke/LightTable"
          timeout 120s xvfb-run -a --server-args="-screen 0 1280x900x24" dbus-run-session -- \
            "$BUNDLE/Python/bin/python3" -B scripts/linux/desktop-smoke.py "$BUNDLE"

      - name: Require native Wayland startup on a headless compositor
        if: github.event_name != 'pull_request' || inputs.build_package
        timeout-minutes: 3
        run: |
          BUNDLE="$PWD/.build/linux/native desktop smoke/LightTable"
          timeout 125s dbus-run-session -- "$BUNDLE/Python/bin/python3" -B \
            scripts/linux/wayland-smoke.py "$BUNDLE"

      - name: Require X11 native edit, RGB16 export and normal reopen
        if: github.event_name != 'pull_request' || inputs.build_package
        timeout-minutes: 6
        run: |
          BUNDLE="$PWD/.build/linux/native desktop smoke/LightTable"
          SOURCE_REVISION=$(git rev-parse HEAD)
          timeout --kill-after=20s 270s xvfb-run -a --server-args="-screen 0 1280x900x24" dbus-run-session -- \
            "$BUNDLE/Python/bin/python3" -B scripts/linux/desktop-acceptance.py "$BUNDLE" \
            --expected-source "$SOURCE_REVISION" --timeout 240 --report-dir .build/linux-native-acceptance

      - name: Upload X11 native acceptance evidence
        if: always() && (github.event_name != 'pull_request' || inputs.build_package)
        uses: actions/upload-artifact@v4
        with:
          name: Linux-X11-native-acceptance
          path: .build/linux-native-acceptance/
          if-no-files-found: ignore

      - name: Require signed native update and failed-startup launcher recovery
        if: github.event_name != 'pull_request' || inputs.build_package
        timeout-minutes: 10
        run: |
          BUNDLE="$PWD/.build/linux/native desktop smoke/LightTable"
          # Copies use ephemeral test signing/version metadata and private XDG
          # data. No release credentials or public update feed are contacted.
          timeout --kill-after=20s 540s xvfb-run -a --server-args="-screen 0 1280x900x24" dbus-run-session -- \
            "$BUNDLE/Python/bin/python3" -B scripts/linux/updater-smoke.py "$BUNDLE"

      - name: Prepare local pacman package recipe
        if: github.event_name != 'pull_request' || inputs.build_package
        env:
          PACKAGE_VERSION: ${{ inputs.version || format('0.1.0-ci.{0}', github.run_number) }}
        run: |
          python3 scripts/linux/make-arch-package.py \
            "dist/LightTable-$PACKAGE_VERSION-linux-x86_64.tar.gz" --output-dir .build/linux/arch-package

      - name: Upload matching local pacman recipe
        if: github.event_name != 'pull_request' || inputs.build_package
        uses: actions/upload-artifact@v4
        with:
          name: LightTable-arch-recipe
          path: |
            .build/linux/arch-package/PKGBUILD
            .build/linux/arch-package/app.lighttable.LightTable.desktop
          include-hidden-files: true
          if-no-files-found: error
