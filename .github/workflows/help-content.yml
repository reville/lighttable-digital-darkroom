name: In-app help

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: Require every locale to be complete (the release gate); pull requests and main allow pending translations
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  help:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source-linked help and search
        run: |
          python3 scripts/help_content.py check
          python3 -m unittest discover -s tests -p 'test_help_content.py' -v
          node --test tests/help-search.test.mjs
      - name: Translation sources, catalogs, and localized Help
        # New English strings may ship with pending translations between releases;
        # the release build and a strict dispatch require complete catalogs.
        env:
          MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.strict) && 'strict' || 'pending' }}
        run: |
          if [[ "$MODE" == strict ]]; then PENDING=""; else PENDING="--allow-pending"; fi
          python3 -m pip install --constraint requirements-runtime.lock numpy pillow
          python3 scripts/localization.py check $PENDING
          python3 scripts/extract-web-i18n.py --check
          python3 scripts/native_localization_sources.py
          python3 server_localization.py check
          python3 scripts/help_content.py localization-check $PENDING
          python3 -m unittest discover -s tests -p 'test_help_localization.py' -v
          python3 -m unittest discover -s tests -p 'test_web_i18n_extraction.py' -v
          python3 -m unittest discover -s tests -p 'test_native_localization.py' -v
          python3 -m unittest discover -s tests -p 'test_server_localization.py' -v
      - name: Web behavior
        run: node --test tests/*.test.mjs
