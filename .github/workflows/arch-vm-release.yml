name: Arch virtual GPU acceptance
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution to verify using the same publishable Arch package
        required: false
        default: both
        type: choice
        options: [both, arch, omarchy]
      package_run_id:
        description: Completed Arch release acceptance run containing the packages to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: arch-vm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        distribution: ${{ fromJSON(inputs.distribution == 'arch' && '["arch"]' || inputs.distribution == 'omarchy' && '["omarchy"]' || '["arch","omarchy"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: LightTable-arch-acceptance
          path: baseline
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
      - name: Boot Arch with a virtual graphics device and test Hyprland
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
          timeout 2100s bash scripts/linux/arch-release-vm.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LightTable-${{ matrix.distribution }}-VM
          path: evidence
          if-no-files-found: error
