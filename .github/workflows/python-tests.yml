name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scope:
    # Decide which checks this change needs; see scripts/ci/change-scope.py.
    # Pushes, dispatches, and release calls always run everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      pixel: ${{ steps.scope.outputs.pixel }}
      windows: ${{ steps.scope.outputs.windows }}
      linux: ${{ steps.scope.outputs.linux }}
      installers: ${{ steps.scope.outputs.installers }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: |
          changed="$RUNNER_TEMP/changed-files.txt"
          : > "$changed"
          if [[ "$EVENT" == pull_request ]]; then
            # An unreadable file list falls back to the full tier.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" \
              --jq '.[].filename' > "$changed" || : > "$changed"
          fi
          python3 scripts/ci/change-scope.py --event "$EVENT" --labels "$LABELS" \
            < "$changed" | tee -a "$GITHUB_OUTPUT"

  unit:
    needs: scope
    # Documentation-only changes skip the suite; a skipped required job counts as passing.
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PYTHON_SOURCE_REV: 3bb2c2d2801ff68b92019cf1dbcbb133d60832bc
      RUST_SOURCE_REV: 9dd59b0380194b93686aaa230a8bb9680aa270a4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-runtime.lock

      - name: Install the runtime set
        run: |
          # The cross-platform suite also exercises Linux float ICC transforms.
          # macOS itself uses ColorSync, so this is a test dependency only.
          brew install little-cms2 ffmpeg
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix little-cms2)/lib:/usr/local/lib:/usr/lib" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.lock
          python -m pip install cryptography==50.0.1

      - uses: actions/cache@v4
        with:
          path: .build/reference-runtimes
          key: film-reference-v1-${{ env.PYTHON_SOURCE_REV }}-${{ env.RUST_SOURCE_REV }}
      - name: Prepare and verify the pinned film runtimes
        run: |
          prepare_reference() {
            local url="$1" revision="$2" destination="$3" fresh=false
            if [[ ! -d "$destination/.git" ]]; then
              git clone --filter=blob:none --no-checkout "$url" "$destination"
              fresh=true
            fi
            [[ "$(git -C "$destination" remote get-url origin)" == "$url" ]] || { echo 'Reference cache remote differs'; exit 1; }
            # Never silently use a sibling checkout or a modified cached runtime.
            [[ "$fresh" == true || -z "$(git -C "$destination" status --porcelain --ignored --untracked-files=all)" ]] || { echo 'Reference cache is dirty'; exit 1; }
            if ! git -C "$destination" cat-file -e "$revision^{commit}"; then
              git -C "$destination" fetch --depth=1 origin "$revision"
            fi
            git -C "$destination" checkout --detach "$revision"
            [[ "$(git -C "$destination" rev-parse HEAD)" == "$revision" ]]
          }
          mkdir -p .build/reference-runtimes
          prepare_reference https://github.com/andreavolpato/agx-emulsion.git "$PYTHON_SOURCE_REV" .build/reference-runtimes/python
          prepare_reference https://github.com/turbasvin/spektrafilm-rs.git "$RUST_SOURCE_REV" .build/reference-runtimes/rust
          mkdir -p engine vendor/spektrafilm/src
          test ! -e engine/data
          test ! -e vendor/spektrafilm/src/spektrafilm
          cp -R .build/reference-runtimes/rust/data engine/data
          cp -R .build/reference-runtimes/python/src/spektrafilm vendor/spektrafilm/src/spektrafilm

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.scope.outputs.pixel == 'true'
      - uses: actions/cache@v4
        if: needs.scope.outputs.pixel == 'true'
        with:
          path: build/processing-cargo
          key: processing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-engine/Cargo.lock', 'rust-engine/**/Cargo.toml') }}

      # The control audit and the frozen renders drive this engine. Build it
      # before the unit step or both suites skip themselves and the job stays
      # green while checking nothing. The light tier (no pixel-path change)
      # skips the engine on purpose; pushes to main always run it.
      - name: Build the resident film engine
        if: needs.scope.outputs.pixel == 'true'
        run: CARGO_TARGET_DIR=build/processing-cargo cargo build --manifest-path rust-engine/Cargo.toml --locked

      - name: Unit and contract tests
        run: PYTHONPATH=".:vendor/spektrafilm/src" python -m unittest discover -s tests -p 'test_*.py' -t tests --verbose

      - name: Confirm the engine-backed gates were not skipped
        if: needs.scope.outputs.pixel == 'true'
        run: |
          test -x build/processing-cargo/debug/lighttable-engine
          PYTHONPATH=".:vendor/spektrafilm/src:tests" python - <<'CHECK'
          import engine_runner
          assert engine_runner.available(), "engine missing; audit and goldens skipped"
          print("engine present:", engine_runner.binary())
          CHECK

      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.pixel == 'true'
        with:
          name: control-audit
          path: build/control-audit
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure() && needs.scope.outputs.pixel == 'true'
        with:
          name: golden-diffs
          path: build/golden-diffs
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare the pinned browser test runtime
        if: needs.scope.outputs.pixel == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/processing-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/processing-browser/node_modules/.bin/playwright" install chromium
          echo "LIGHTTABLE_PLAYWRIGHT_MODULE=$RUNNER_TEMP/processing-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Independent film, export, and application pixel gates
        if: needs.scope.outputs.pixel == 'true'
        run: python scripts/check-processing.py --suites film,export,webgl,app
      # A hosted runner is not evidence of an actual Metal/display session.
      # The native gate is required by the local full command documented in
      # docs/processing-correctness.md; unavailable native renderers fail that gate.
      - uses: actions/upload-artifact@v4
        if: always() && needs.scope.outputs.pixel == 'true'
        with:
          name: processing-correctness
          path: build/processing-correctness
          if-no-files-found: warn
          retention-days: 14

  installers:
    needs: scope
    if: needs.scope.outputs.installers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer behavior and launcher tests
        run: |
          python3 -m unittest discover -s tests -p test_installer_manifests.py -v
          python3 -m unittest discover -s tests -p test_release_selection.py -v
          python3 -m unittest discover -s tests -p test_linux_aur_packaging.py -v
          python3 -m unittest discover -s tests -p test_linux_snap_packaging.py -v
          python3 -m unittest discover -s tests -p test_cli_installation.py -v
          python3 -m unittest discover -s tests -p test_no_hardlink_filesystem.py -v
          npm test --prefix packaging/npm
          (cd packaging/npm && npm pack --dry-run)
