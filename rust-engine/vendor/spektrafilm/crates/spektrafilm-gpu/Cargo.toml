[package]
name = "spektrafilm-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu"]
cuda-backend = ["dep:cudarc"]
precision-f64 = ["spektrafilm-math/precision-f64"]

[dependencies]
spektrafilm-math.workspace = true
rayon.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu = { workspace = true, optional = true, features = ["wgsl"] }
cudarc = { version = "0.19.7", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# Native BLAS for CPU spectral integration — matches numpy's
# Accelerate-backed einsum bit-exactly on macOS.
cblas = "0.4"
blas-src = { version = "0.10", features = ["accelerate"] }
accelerate-src = "0.3"

[target.'cfg(all(not(target_os = "macos"), not(target_os = "windows")))'.dependencies]
cblas = "0.4"
blas-src = { version = "0.10", features = ["openblas"] }
openblas-src = "0.10"

[dev-dependencies]
tracing-subscriber = { workspace = true }
